<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregnancy Announcement Collection - Steven K Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sage-green: #8b9d83;
            --forest-green: #4a5d4a;
            --warm-tan: #d4c5b0;
            --cream: #f5f2ed;
            --text-dark: #2d2d2d;
            --text-light: #666;
            --serif: 'Libre Baskerville', serif;
            --sans: 'Work Sans', sans-serif;
        }

        body {
            font-family: var(--sans);
            background-color: var(--cream);
            color: var(--text-dark);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(245, 242, 237, 0.98);
            z-index: 1000;
            padding: 1.5rem 5%;
            border-bottom: 1px solid rgba(139, 157, 131, 0.15);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--serif);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--forest-green);
            text-decoration: none;
        }

        .back-link {
            color: var(--sage-green);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-link:hover {
            color: var(--forest-green);
        }

        /* Header */
        .collection-header {
            padding: 10rem 5% 5rem;
            text-align: center;
            background: white;
        }

        .collection-header h1 {
            font-family: var(--serif);
            font-size: 4rem;
            color: var(--forest-green);
            margin-bottom: 1rem;
        }

        .collection-header p {
            font-size: 1.2rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 5%;
        }

        .event-section {
            margin-bottom: 6rem;
        }

        .event-title {
            font-family: var(--serif);
            font-size: 2rem;
            color: var(--forest-green);
            margin-bottom: 3rem;
            text-align: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .gallery-item {
            aspect-ratio: 3/4;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        @media (max-width: 768px) {
            .collection-header h1 {
                font-size: 2.5rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== Cinematic motion ===== */
        :root {
            --ease-cine: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-shutter: cubic-bezier(0.77, 0, 0.18, 1);
        }
        html.cine-pre::after {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--forest-green);
            z-index: 4999;
        }
        html.cine-boot *,
        html.cine-boot *::before,
        html.cine-boot *::after { transition: none !important; }

        .cine-curtain {
            position: fixed;
            inset: 0;
            background: var(--forest-green);
            z-index: 5000;
            pointer-events: none;
            transition: transform 0.95s var(--ease-shutter);
        }
        .cine-curtain.lift { transform: translate3d(0, -100%, 0); }
        .cine-curtain.drop { transform: translate3d(0, 100%, 0); transition-duration: 0.75s; }
        .cine-curtain.drop.cover { transform: none; }

        html.cine .collection-header h1 .cine-line {
            display: block;
            overflow: hidden;
            padding-bottom: 0.1em;
        }
        html.cine .collection-header h1 .cine-line > span {
            display: block;
            transform: translate3d(0, 110%, 0);
            transition: transform 1.3s var(--ease-cine) 0.25s;
        }
        html.cine.page-in .collection-header h1 .cine-line > span { transform: none; }
        html.cine .collection-header p {
            opacity: 0;
            transform: translate3d(0, 24px, 0);
            transition: opacity 1.2s var(--ease-cine) 0.55s, transform 1.2s var(--ease-cine) 0.55s;
        }
        html.cine.page-in .collection-header p { opacity: 1; transform: none; }

        html.cine .gallery-item img {
            clip-path: inset(100% 0 0 0);
            scale: 1.35;
            filter: brightness(1.7) saturate(0.15) contrast(0.8);
            transition: clip-path 1.4s var(--ease-shutter), scale 2s var(--ease-cine), filter 1.8s ease 0.3s, transform 0.6s ease;
        }
        html.cine .gallery-item.is-in img { clip-path: inset(0 0 0 0); scale: 1; filter: none; }

        .lightbox.active img { animation: lightboxIn 0.8s var(--ease-cine); }
        @keyframes lightboxIn {
            from { opacity: 0; scale: 0.92; filter: blur(12px); }
            to { opacity: 1; scale: 1; filter: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cine-curtain { display: none !important; }
            .lightbox.active img { animation: none; }
        }
    </style>
    <script>
        (function () {
            try {
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                var d = document.documentElement;
                d.classList.add('cine-pre');
                setTimeout(function () { d.classList.remove('cine-pre'); }, 3000);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">stevenkmedia</a>
            <a href="index.html#collections" class="back-link">← Back to Collections</a>
        </div>
    </nav>

    <!-- Header -->
    <div class="collection-header">
        <h1>Pregnancy Announcement Collection</h1>
        <p>Sharing the joy of a growing family and the newest chapter of your story</p>
    </div>

    <!-- Gallery Container -->
    <div class="gallery-container">
        <div class="gallery-grid">
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="images/pregnancy-1.jpg" alt="Pregnancy Announcement Photo 1">
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="images/pregnancy-2.jpg" alt="Pregnancy Announcement Photo 2">
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="images/pregnancy-3.jpg" alt="Pregnancy Announcement Photo 3">
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="images/pregnancy-4.jpg" alt="Pregnancy Announcement Photo 4">
            </div>
            <!-- Add more photos here by copying a gallery-item block above -->
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        function openLightbox(element) {
            const img = element.querySelector('img');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            lightboxImg.src = img.src;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }

        // Close lightbox on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
    <script>
    /* Cinematic motion: curtain lifts in, photos develop as they scroll into view,
       curtain drops when leaving. If anything fails, the page shows normally. */
    (function () {
        var root = document.documentElement;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
            root.classList.remove('cine-pre');
            return;
        }
        try {
            var title = document.querySelector('.collection-header h1');
            if (title) title.innerHTML = '<span class="cine-line"><span>' + title.innerHTML + '</span></span>';

            var items = Array.prototype.slice.call(document.querySelectorAll('.gallery-item'));
            root.classList.add('cine', 'cine-boot');

            var curtain = document.createElement('div');
            curtain.className = 'cine-curtain';
            curtain.setAttribute('aria-hidden', 'true');
            document.body.appendChild(curtain);
            root.classList.remove('cine-pre');

            function columnCount(el) {
                var g = getComputedStyle(el).gridTemplateColumns;
                return g && g !== 'none' ? g.split(' ').length : 1;
            }

            function reveal(item) {
                if (item._revealed) return;
                item._revealed = true;
                var grid = item.parentElement;
                var d = (items.indexOf(item) % columnCount(grid)) * 0.14;
                var img = item.querySelector('img');
                if (img) img.style.transitionDelay = d + 's, ' + d + 's, ' + (d + 0.3) + 's, 0s';
                item.classList.add('is-in');
                setTimeout(function () { if (img) img.style.transitionDelay = '0s'; }, (d + 2.3) * 1000);
            }

            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (!e.isIntersecting) return;
                    io.unobserve(e.target);
                    reveal(e.target);
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    root.classList.remove('cine-boot');
                    items.forEach(function (it) { io.observe(it); });
                    requestAnimationFrame(function () {
                        curtain.classList.add('lift');
                        root.classList.add('page-in');
                        setTimeout(function () { curtain.remove(); }, 1200);
                    });
                });
            });

            document.addEventListener('click', function (e) {
                if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
                var a = e.target.closest('a[href]');
                if (!a || a.target === '_blank') return;
                var url;
                try { url = new URL(a.href, window.location.href); } catch (err) { return; }
                if (url.origin !== window.location.origin || url.pathname === window.location.pathname) return;
                e.preventDefault();
                var c = document.createElement('div');
                c.className = 'cine-curtain drop';
                document.body.appendChild(c);
                c.getBoundingClientRect();
                c.classList.add('cover');
                setTimeout(function () { window.location.href = url.href; }, 760);
            });
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) document.querySelectorAll('.cine-curtain').forEach(function (c) { c.remove(); });
            });

            window.addEventListener('load', function () {
                setTimeout(function () {
                    items.forEach(function (it) {
                        if (it.getBoundingClientRect().top < window.innerHeight) reveal(it);
                    });
                }, 4000);
            });
        } catch (err) {
            root.classList.remove('cine', 'cine-pre', 'cine-boot');
            document.querySelectorAll('.cine-curtain').forEach(function (c) { c.remove(); });
        }
    })();
    </script>
</body>
</html>
